name: Deploy bot to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/bot-parts/**"
      - "supabase/functions/parse-task/**"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jaaidfpfeihxfhzxsuak
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; fi
      - name: Build smooth-worker from the parts
        run: |
          mkdir -p supabase/functions/smooth-worker
          cat supabase/bot-parts/part1.txt supabase/bot-parts/part2.txt supabase/bot-parts/part3.txt supabase/bot-parts/part4.txt \
              supabase/bot-parts/part5.txt supabase/bot-parts/part6.txt supabase/bot-parts/part7.txt > supabase/functions/smooth-worker/index.ts
          wc -c supabase/functions/smooth-worker/index.ts
      - name: Deploy smooth-worker (WhatsApp bot)
        run: supabase functions deploy smooth-worker --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Deploy parse-task (voice task for the CEO)
        run: supabase functions deploy parse-task --project-ref "$PROJECT_REF" --no-verify-jwt --yes
